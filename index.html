<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Graduation Invitation VIP</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500&family=Cormorant+Garamond:wght@500;600&family=Quicksand:wght@400;500&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:'Poppins',sans-serif;
    overflow:hidden;
    background:#dfe9f3;
}

/* ===== MOBILE FULL SCREEN ===== */
#exportArea{
    width:100vw;
    height:100vh;
    position:relative;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* Background */
.bg-layer{
    position:absolute;
    inset:0;
    background:url("https://i.imgur.com/Vh6vJSt.jpeg") center/cover no-repeat;
    filter:blur(8px) brightness(1.1);
    transform:scale(1.1);
    z-index:0;
}

.overlay-light{
    position:absolute;
    inset:0;
    background:rgba(255,255,255,0.35);
    z-index:1;
}

/* 🌸 Sakura Advanced */
#sakura-container{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:2;
}

.sakura{
    position:absolute;
    top:-50px;
    animation:fall linear forwards;
}

@keyframes fall{
    0%{
        transform:translateY(0) translateX(0) rotate(0deg);
        opacity:0.8;
    }
    50%{
        transform:translateY(50vh) translateX(40px) rotate(180deg);
    }
    100%{
        transform:translateY(110vh) translateX(-60px) rotate(360deg);
        opacity:0.3;
    }
}

/* Card */
.card{
    width:90%;
    max-width:420px;
    padding:50px 30px;
    border-radius:40px;
    backdrop-filter:blur(40px);
    background:rgba(255,255,255,0.4);
    box-shadow:0 30px 80px rgba(0,0,0,0.3);
    text-align:center;
    color:#2f3e63;
    position:relative;
    z-index:3;
}

.invite{font-family:'Great Vibes';font-size:40px;}
.title{font-family:'Playfair Display';font-size:50px;font-weight:700;margin-bottom:20px;}
#guestName{font-family:'Great Vibes';font-size:45px;margin:20px 0;display:block;}
.desc{font-family:'Cormorant Garamond';font-size:18px;margin-bottom:25px;font-style:italic;}
.section-title{font-size:13px;letter-spacing:3px;margin-top:18px;}
#time{font-family:'Libre Baskerville';font-size:18px;}
#date{font-family:'Playfair Display';font-size:22px;font-weight:600;margin-top:5px;}
#location{font-family:'Quicksand';font-size:18px;font-weight:500;margin-top:5px;}
.footer{margin-top:25px;font-family:'Great Vibes';font-size:28px;}

/* Controls */
.controls{
    position:fixed;
    bottom:20px;
    right:20px;
    display:flex;
    gap:10px;
    z-index:9999;
}
button{
    padding:10px 18px;
    border:none;
    border-radius:30px;
    cursor:pointer;
    background:#2f3e63;
    color:white;
}
.panel{
    position:fixed;
    right:20px;
    bottom:90px;
    background:white;
    padding:20px;
    border-radius:20px;
    box-shadow:0 15px 40px rgba(0,0,0,0.25);
    width:260px;
    display:none;
    z-index:9999;
}
.panel input{
    width:100%;
    margin-bottom:10px;
    padding:8px;
    border-radius:10px;
    border:1px solid #ccc;
}

.hide-on-export{display:none!important;}

/* Popup */
.overlay-popup{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);
    backdrop-filter:blur(8px);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:10000;
}
.popup{
    background:rgba(255,255,255,0.95);
    padding:40px;
    border-radius:30px;
    text-align:center;
}
.popup h2{font-family:'Playfair Display';margin-bottom:15px;}
.popup p{margin-bottom:20px;}
.popup .btn-group{display:flex;justify-content:center;gap:15px;}
</style>
</head>

<body>

<div id="exportArea">
    <div class="bg-layer"></div>
    <div class="overlay-light"></div>
    <div id="sakura-container"></div>

    <div class="card" id="card">
        <div class="invite">You're Invited</div>
        <div class="title">GRADUATION</div>
        <span id="guestName">Bạn</span>
        <div class="desc">Đây là ngày mình muốn lưu trữ những khoảnh khắc đẹp nhất của thời thanh xuân . Thật hạnh phúc khi những bức ảnh thanh xuân của mình có sự góp mặt của bạn</div>

        <div class="section-title">THỜI GIAN</div>
        <div id="time">10:00 AM</div>
        <div id="date">01.03.2026</div>

        <div class="section-title">ĐỊA ĐIỂM</div>
        <div id="location">cca 2</div>

        <div class="footer" id="hostName">baou</div>
    </div>
</div>

<audio id="bgMusic" src="music.mp3" loop></audio>

<div class="controls" id="controls">
    <button id="editBtn">Chỉnh sửa</button>
    <button id="saveBtn">Lưu thiệp</button>
</div>

<div class="panel" id="panel">
    <input type="text" id="inputHost" placeholder="Tên chủ thiệp">
    <input type="text" id="inputGuest" placeholder="Tên người mời">
    <input type="date" id="inputDate">
    <input type="time" id="inputTime">
    <input type="text" id="inputLocation" placeholder="Địa điểm">
    <button id="updateBtn">Cập nhật</button>
</div>

<script>

/* 🌸 Sakura Realistic */
function createSakura(){
    const s=document.createElement("div");
    s.className="sakura";
    s.style.left=Math.random()*window.innerWidth+"px";

    const size=Math.random()*20+15;
    s.style.fontSize=size+"px";

    const duration=Math.random()*5+6;
    s.style.animationDuration=duration+"s";

    s.innerHTML="🌸";
    document.getElementById("sakura-container").appendChild(s);

    setTimeout(()=>s.remove(),duration*1000);
}
setInterval(createSakura,400);

/* Popup nhạc */
window.onload=function(){ showMusicPopup(); };

function showMusicPopup(){
    const div=document.createElement("div");
    div.className="overlay-popup";
    div.innerHTML=`
        <div class="popup">
            <h2>Phát nhạc nền?</h2>
            <p>Bật nhạc để thiệp thêm cảm xúc 🎓</p>
            <div class="btn-group">
                <button onclick="startMusic()">OK</button>
                <button onclick="closePopup()">Không</button>
            </div>
        </div>`;
    document.body.appendChild(div);
}
function startMusic(){ bgMusic.play(); closePopup(); }
function closePopup(){ document.querySelector(".overlay-popup")?.remove(); }

/* Edit */
editBtn.onclick=()=>panel.style.display=panel.style.display==="block"?"none":"block";

updateBtn.onclick=function(){
    if(inputHost.value) hostName.innerText=inputHost.value;
    if(inputGuest.value) guestName.innerText=inputGuest.value;
    if(inputLocation.value) location.innerText=inputLocation.value;
    if(inputDate.value){
        const d=new Date(inputDate.value);
        date.innerText=String(d.getDate()).padStart(2,'0')+"."+String(d.getMonth()+1).padStart(2,'0')+"."+d.getFullYear();
    }
    if(inputTime.value){
        let [h,m]=inputTime.value.split(":");
        h=parseInt(h);
        const suffix=h>=12?"PM":"AM";
        h=h%12||12;
        time.innerText=h+":"+m+" "+suffix;
    }
    panel.style.display="none";
};

/* Save */
saveBtn.onclick=function(){
    controls.classList.add("hide-on-export");
    panel.classList.add("hide-on-export");

    html2canvas(document.getElementById("exportArea"),{
        scale:2,
        useCORS:true,
        backgroundColor:null
    }).then(canvas=>{
        const link=document.createElement("a");
        link.download="Graduation.png";
        link.href=canvas.toDataURL("image/png",1.0);
        link.click();

        const div=document.createElement("div");
        div.className="overlay-popup";
        div.innerHTML=`<div class="popup">
            <h2>Ảnh đã tạo 🎉</h2>
            <p>Kiểm tra mục <b>Tải xuống</b> để lưu ảnh.</p>
            <div class="btn-group">
                <button onclick="closePopup()">OK</button>
            </div>
        </div>`;
        document.body.appendChild(div);
            }).finally(()=>{
        controls.classList.remove("hide-on-export");
        panel.classList.remove("hide-on-export");
    });
};

</script>
</body>
</html>
